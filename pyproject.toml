[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdphenology"
version = "0.1.0"
description = "Transparent Bangladesh crop-calendar auditing and vegetation-cycle detection"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
bdphenology = "bdphenology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
